# Release notes for GitHub releases, built by git-cliff from conventional commits
# (build.yml, release job). Commit and PR titles are the lines users read.
[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | unique(attribute="message") | sort(attribute="scope") %}
- {% if commit.scope %}**{{ commit.scope | replace(from="-", to=" ") | upper_first }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/danieldaeschle/rusty-teams/pull/{{ commit.remote.pr_number }}){% if commit.remote.username and commit.remote.username != "danieldaeschle" %} by @{{ commit.remote.username }}{% endif %}){% endif %}
{%- endfor %}
{% endfor %}
{% if previous.version %}
**Full changelog**: https://github.com/danieldaeschle/rusty-teams/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = "^Merge pull request #[0-9]+:? (from \\S+\\s*)?", replace = "" },
  { pattern = "^[^a-zA-Z]+", replace = "" },
  { pattern = "^([^\\n]*?) \\(#[0-9]+\\)", replace = "${1}" },
  { pattern = "^(\\w+)(!?): ", replace = "${1}(app)${2}: " },
  { pattern = "^(\\w+)\\((calling|call|calls|call-e2e)\\)", replace = "${1}(calls)" },
  { pattern = "^(\\w+)\\((chat|chats|messages|conversation)\\)", replace = "${1}(chat)" },
  { pattern = "^(\\w+)\\((channel|channels)\\)", replace = "${1}(channels)" },
  { pattern = "^(\\w+)\\((parity|ui)\\)", replace = "${1}(app)" },
  { pattern = "^(\\w+)\\(ci\\)", replace = "${1}(CI)" },
  { pattern = "^(\\w+)\\(macos\\)", replace = "${1}(mac)" },
  { pattern = "^(\\w+)\\(mcp\\)", replace = "${1}(MCP)" },
  { pattern = "^(\\w+)\\(chatsvc\\)", replace = "${1}(chat)" },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^\\w+\\([^)]*\\): .*\\btests?\\b", skip = true },
  { message = "^\\w+\\(test\\)", skip = true },
  { message = "^\\w+\\((CI|packaging|release|flatpak|build)\\)", group = "<!-- 2 -->Packaging and releases" },
  { message = "^(ci|build)", group = "<!-- 2 -->Packaging and releases" },
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^(fix|perf)", group = "<!-- 1 -->Fixes" },
  { message = ".*", skip = true },
]

[remote.github]
owner = "danieldaeschle"
repo = "rusty-teams"
