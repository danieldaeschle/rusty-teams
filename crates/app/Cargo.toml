[package]
name = "app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "teams"
path = "src/main.rs"

[build-dependencies]
chrono.workspace = true
embed-resource = "3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[dependencies]
chatsvc.workspace = true
chrono.workspace = true
directories.workspace = true
gpui-kit.workspace = true
reqwest_client.workspace = true
graph.workspace = true
serde_json.workspace = true
session.workspace = true
store.workspace = true
teams-core.workspace = true
tokio.workspace = true
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
webview.workspace = true
raw-window-handle = "0.6"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3"] }
tray-icon = { version = "0.21", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
