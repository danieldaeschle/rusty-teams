 # Build and test per README "Quick start": `cargo test`, then `cargo build -p app`.
# Linux and Windows are the supported targets (README "Status"), macOS is a compile check only.
name: Build

on:
  push:
    branches: [main, build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # webrtc-sys compiles its C++ against the hermetic libc++ inside the libwebrtc
    # artifact, which needs a clang as new as that libc++ (clang 21 today, see
    # check_clang_version in vendor/webrtc-sys/build.rs). The distro clang is older
    # (18 on ubuntu-24.04), so the install step below takes the compiler from LLVM's
    # apt repo and these point every compile and the final link at it.
    env:
      CC: clang-21
      CXX: clang++-21
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang-21
    steps:
      - uses: actions/checkout@v4

      # README: "Linux build needs clang + mold (set in .cargo/config.toml)".
      # The rest are headers the calling stack probes at build time: glib for webrtc-sys,
      # alsa for cpal, v4l2 for nokhwa (bindgen wants libclang), xkbcommon for GPUI,
      # libva enables the hardware video codecs of webrtc-sys.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang mold pkg-config libclang-dev \
            libglib2.0-dev libasound2-dev libva-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxdamage-dev \
            libxrandr-dev libxcomposite-dev libwayland-dev libpipewire-0.3-dev

          # apt.llvm.org's llvm.sh adds their apt repo and installs clang-21 (lld-21
          # and friends alongside). The distro clang above stays: it carries
          # libclang-dev, which bindgen loads for nokhwa, and mold is the linker.
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          sudo apt-get install --no-install-recommends -y clang-21

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build -p app --release

      - uses: actions/upload-artifact@v4
        with:
          name: teams-linux
          path: target/release/teams

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # scripts/build-windows.sh stages a copy of gpui-pre-windows with the patches from
      # scripts/gpui-windows-patches and points `patch.crates-io` at it. Same here, except the
      # build.rs rewrite of that script is left out: it only exists so a Linux host can
      # cross-compile, and it would hide fxc.exe from a native Windows build.
      - name: Stage the patched gpui-pre-windows
        run: |
          set -euo pipefail
          manifestPath="$(cargo metadata --format-version 1 --filter-platform x86_64-pc-windows-msvc |
            jq -re '[.packages[] | select(.name == "gpui-pre-windows") | .manifest_path] | first')"
          # cygpath first, then dirname: the old `jq | xargs dirname | cygpath` chain let
          # xargs eat the backslashes of the Windows manifest path as escapes, which left
          # sourceDir at the C: root and `cp -r` walked the whole system drive.
          sourceDir="$(dirname "$(cygpath -u "$manifestPath")")"
          [ -f "$sourceDir/Cargo.toml" ] || { echo "not the gpui-pre-windows crate dir: $sourceDir" >&2; exit 1; }
          patchedDir="$(cygpath -m "$RUNNER_TEMP")/gpui-pre-windows"
          rm -rf "$patchedDir"
          cp -r "$sourceDir" "$patchedDir"
          chmod -R u+w "$patchedDir"
          for patchFile in scripts/gpui-windows-patches/*.patch; do
            git -C "$patchedDir" apply -p1 "$(cygpath -m "$GITHUB_WORKSPACE/$patchFile")"
          done
          echo "GPUI_PRE_WINDOWS_PATCHED=$patchedDir" >> "$GITHUB_ENV"

      # Background effects ship as an embedded DLL, see tools/onnxruntime-dll.
      - name: Build the embedded onnxruntime.dll
        run: |
          (cd tools/onnxruntime-dll && RUSTFLAGS="-C target-feature=-crt-static" cargo build --release)
          echo "CALLING_ONNXRUNTIME_DLL=$(cygpath -m tools/onnxruntime-dll)/target/release/onnxruntime.dll" >> "$GITHUB_ENV"

      - name: Tests
        run: cargo test --config "patch.crates-io.gpui-pre-windows.path=\"$GPUI_PRE_WINDOWS_PATCHED\""

      # fxc.exe comes from the Windows SDK, gpui-pre-windows finds it through the registry.
      - name: Build
        run: cargo build -p app --release --config "patch.crates-io.gpui-pre-windows.path=\"$GPUI_PRE_WINDOWS_PATCHED\""

      - uses: actions/upload-artifact@v4
        with:
          name: teams-windows
          path: target/release/teams.exe