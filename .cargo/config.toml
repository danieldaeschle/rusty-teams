# libwebrtc's prebuilt Windows lib is built with /MT; a /MD Rust build fails to link (RuntimeLibrary mismatch).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Pin the macOS deployment target to 14.0 for both arm64 and x86_64.
# 14.0 is the app's minimum: WebRTC's screen sharing uses ScreenCaptureKit's system
# picker, SCContentSharingPicker (macOS 14+).
# It also keeps x86_64 off Rust's 10.12 default, which is below 10.14.4 and triggers
# CoreMedia.tbd's `$ld$previous$@rpath/libswiftCoreMedia.dylib$$1$10.9$10.14.4$$`
# directive in the macOS 27 SDK, rewriting CoreMedia symbols onto libswiftCoreMedia.dylib
# (which older macOS releases do not re-export CoreMedia from, crashing at launch).
# scripts/build-macos.sh exports its own default for release builds: keep both in sync.
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# libwebrtc's ObjC categories (NSString+StdString, RTCVideoCodecInfo, ...) live in unlinked
# objects of the prebuilt static lib; without -ObjC the app aborts in a C++ static initializer
# (RTCH264ProfileLevelId.mm) before main. webrtc-sys already passes -ObjC, but a dependency's
# link flags never reach the final binary.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]
