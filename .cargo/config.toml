# libwebrtc's prebuilt Windows lib is built with /MT; a /MD Rust build fails to link (RuntimeLibrary mismatch).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS: build each slice for the same minimum as its prebuilt libwebrtc, 10.15 on x86_64
# (rustc and clang raise arm64 to 11.0, the arm64 prebuilt's minimum). Rust's x86_64 default,
# 10.12, is below 10.14.4, where the macOS 27 SDK links CoreMedia as @rpath/libswiftCoreMedia.dylib.
# Ignored by other targets; an exported MACOSX_DEPLOYMENT_TARGET still wins.
[env]
MACOSX_DEPLOYMENT_TARGET = "10.15"

# libwebrtc's ObjC categories (NSString+StdString, RTCVideoCodecInfo, ...) live in unlinked
# objects of the prebuilt static lib; without -ObjC the app aborts in a C++ static initializer
# (RTCH264ProfileLevelId.mm) before main. webrtc-sys already passes -ObjC, but a dependency's
# link flags never reach the final binary. The x86_64 prebuilt also autolinks a Swift runtime
# dylib (@rpath/libswiftCoreMedia.dylib) that lives in the dyld shared cache only.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC", "-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC", "-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
