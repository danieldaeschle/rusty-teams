# libwebrtc's prebuilt Windows lib is built with /MT; a /MD Rust build fails to link (RuntimeLibrary mismatch).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS 14 is the minimum: screen and window sharing use ScreenCaptureKit's
# SCContentSharingPicker (macOS 14+). Ignored by other targets; an exported
# MACOSX_DEPLOYMENT_TARGET still wins. scripts/build-macos.sh exports the same
# default for release builds: keep both in sync.
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# libwebrtc's ObjC categories (NSString+StdString, RTCVideoCodecInfo, ...) live in unlinked
# objects of the prebuilt static lib; without -ObjC the app aborts in a C++ static initializer
# (RTCH264ProfileLevelId.mm) before main. webrtc-sys already passes -ObjC, but a dependency's
# link flags never reach the final binary.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]
