[workspace]
members = ["crates/*"]
exclude = ["spikes/*", "vendor"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
percent-encoding = "2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "process"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
url = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }

app-base = { path = "crates/app-base" }
app-call-model = { path = "crates/app-call-model" }
app-state = { path = "crates/app-state" }
app-ui-kit = { path = "crates/app-ui-kit" }
agents = { path = "crates/agents" }
session = { path = "crates/session" }
graph = { path = "crates/graph" }
store = { path = "crates/store" }
mcp = { path = "crates/mcp" }
teams-core = { path = "crates/core" }
gpui-kit = "=0.7.1"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
calling = { path = "crates/calling" }
chatsvc = { path = "crates/chatsvc" }
webview = { path = "crates/webview" }

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
webrtc-sys = { path = "vendor/webrtc-sys" }

# Linux builds and tests: file:line backtraces for our crates, no debuginfo for dependencies.
# Full debuginfo (the default) made every test and example binary hundreds of MB, gpui, libwebrtc and tract included.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
incremental = true
codegen-units = 256

[profile.release.package."*"]
codegen-units = 16

[profile.release.package.app]
opt-level = 1

[profile.release.package.app-base]
opt-level = 1

[profile.release.package.app-call-model]
opt-level = 1

[profile.release.package.app-ui-kit]
opt-level = 1

[profile.release.package.app-state]
opt-level = 1
